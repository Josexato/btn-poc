<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Navaja</title>
<style>
  :root {
    --bg: #eef0f3;
    --surface: #ffffff;
    --surface-2: #f5f6f8;
    --text: #1b222c;
    --muted: #5d6673;
    --border: #d7dbe1;
    --accent: #c46a1a;
    --accent-ink: #ffffff;
    --canvas-bg: #e3e6ea;
    --grid-major: #b9bfc7;
    --grid-minor: #d2d6dc;
    --page-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161a20;
      --surface: #1e232b;
      --surface-2: #242a33;
      --text: #e6eaf0;
      --muted: #97a0ad;
      --border: #333b46;
      --accent: #e0913f;
      --accent-ink: #201503;
      --canvas-bg: #1a1f26;
      --grid-major: #3a424d;
      --grid-minor: #272d36;
      --page-bg: #ffffff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161a20;
    --surface: #1e232b;
    --surface-2: #242a33;
    --text: #e6eaf0;
    --muted: #97a0ad;
    --border: #333b46;
    --accent: #e0913f;
    --accent-ink: #201503;
    --canvas-bg: #1a1f26;
    --grid-major: #3a424d;
    --grid-minor: #272d36;
    --page-bg: #ffffff;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  header h1 span { color: var(--accent); }
  #fileLabel {
    font-family: ui-monospace, monospace;
    font-size: .78rem;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 38vw;
  }
  .spacer { flex: 1; }
  .btn {
    font: inherit;
    font-size: .82rem;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 13px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  input[type="file"] { display: none; }

  #stage { position: relative; flex: 1; min-height: 0; }
  .view { position: absolute; inset: 0; }
  .view[hidden] { display: none !important; }
  #view3d canvas { display: block; }

  /* Vista 2D (SVG / GAG) con pan-zoom */
  #view2d { overflow: hidden; background: var(--canvas-bg); touch-action: none; cursor: grab; }
  #view2d.panning { cursor: grabbing; }
  #pz { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #pz img, #pz svg { display: block; background: var(--page-bg); box-shadow: 0 2px 14px rgba(0,0,0,.18); }

  /* Vista PDF */
  #viewpdf { overflow: auto; background: var(--canvas-bg); }
  #pdfPages { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
  #pdfPages canvas { background: var(--page-bg); box-shadow: 0 2px 14px rgba(0,0,0,.18); max-width: 100%; height: auto; }

  .panel {
    position: absolute;
    z-index: 4;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    backdrop-filter: blur(4px);
  }
  #statsPanel { top: 14px; left: 14px; min-width: 200px; max-width: 300px; }
  #statsPanel h2 {
    margin: 0 0 8px;
    font-size: .68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--muted);
  }
  .stat { display: flex; justify-content: space-between; gap: 16px; font-size: .8rem; padding: 2px 0; }
  .stat b { font-family: ui-monospace, monospace; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
  .stat .lbl { color: var(--muted); white-space: nowrap; }
  .note { font-size: .72rem; color: var(--muted); margin-top: 8px; line-height: 1.35; }

  #controls { right: 14px; top: 14px; display: flex; flex-direction: column; gap: 8px; }
  #controls .grp { display: none; flex-direction: column; gap: 8px; }
  #controls .grp.on { display: flex; }
  #controls label { display: flex; align-items: center; gap: 8px; font-size: .8rem; cursor: pointer; }
  #controls select, #controls input[type="color"] {
    font: inherit; font-size: .8rem;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px;
  }
  #controls input[type="color"] { padding: 1px 2px; width: 44px; height: 26px; }
  #controls .btn { padding: 5px 10px; }
  .zoomrow { display: flex; gap: 6px; align-items: center; }
  .zoomrow b { font-family: ui-monospace, monospace; font-size: .78rem; min-width: 46px; text-align: center; }

  #errorBar {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 7; background: #8f2c20; color: #fff; font-size: .82rem;
    border-radius: 8px; padding: 8px 16px; max-width: min(90%, 480px);
  }
  #busyBar {
    position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 8;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 40% 100%; background-repeat: no-repeat;
    animation: busy 1s linear infinite;
  }
  @keyframes busy { from { background-position: -40% 0; } to { background-position: 140% 0; } }
  @media (prefers-reduced-motion: reduce) { #busyBar { animation: none; background: var(--accent); } }

  footer {
    padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px));
    font-size: .72rem; color: var(--muted);
    background: var(--surface); border-top: 1px solid var(--border);
  }
  @media (max-width: 640px) {
    #fileLabel { display: none; }
    #statsPanel { top: auto; bottom: 10px; left: 10px; right: 10px; max-width: none; min-width: 0; }
    .stat { font-size: .74rem; }
    #controls { padding: 10px; }
  }
  [hidden] { display: none !important; }
  img { max-width: 100%; }
</style>

</head>
<body>
<header>
  <h1>Navaja <span>◆</span></h1>
  <span id="fileLabel">pieza de ejemplo — abre GAG · SVG · STL · OBJ · PDF</span>
  <span class="spacer"></span>
  <button class="btn primary" id="openBtn">Abrir archivo</button>
  <input type="file" id="fileInput" accept=".gag,.sdjf,.svg,.stl,.obj,.pdf,application/pdf,image/svg+xml">
</header>

<div id="stage">
  <div id="view3d" class="view"></div>
  <div id="view2d" class="view" hidden><div id="pz"></div></div>
  <div id="viewpdf" class="view" hidden><div id="pdfPages"></div></div>

  <div class="panel" id="statsPanel">
    <h2 id="statsTitle">Pieza</h2>
    <div id="statsBody"></div>
  </div>

  <div class="panel" id="controls">
    <div class="grp" id="grp3d">
      <label>Material
        <select id="matSelect">
          <option value="solid" selected>Sólido</option>
          <option value="normals">Normales</option>
        </select>
      </label>
      <label>Color <input type="color" id="colorPick" value="#9fb0c3"></label>
      <label><input type="checkbox" id="wireChk"> Malla</label>
      <label><input type="checkbox" id="gridChk" checked> Rejilla</label>
      <label><input type="checkbox" id="spinChk"> Rotar</label>
      <button class="btn" id="resetBtn">Centrar vista</button>
    </div>
    <div class="grp" id="grp2d">
      <div class="zoomrow">
        <button class="btn" id="zoomOut2d">−</button>
        <b id="zoomLbl2d">100%</b>
        <button class="btn" id="zoomIn2d">+</button>
      </div>
      <button class="btn" id="fit2d">Ajustar</button>
    </div>
    <div class="grp" id="grpPdf">
      <div class="zoomrow">
        <button class="btn" id="zoomOutPdf">−</button>
        <b id="zoomLblPdf">100%</b>
        <button class="btn" id="zoomInPdf">+</button>
      </div>
    </div>
  </div>

  <div id="errorBar" hidden></div>
  <div id="busyBar" hidden></div>
</div>

<footer>
  Todo se procesa en tu dispositivo: nada se sube a ningún servidor. STL/OBJ en mm; peso estimado con PLA 1,24 g/cm³. La vista de .gag/.sdjf es una previsualización rápida — el render oficial es el SVG de AlmaGag.
</footer>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/STLLoader.js"></script>
<script src="lib/OBJLoader.js"></script>
<script src="lib/pdf.min.js"></script>
<script>
(function () {
  'use strict';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'lib/pdf.worker.min.js';

  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const fileInput = $('fileInput');
  const fileLabel = $('fileLabel');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fmt = new Intl.NumberFormat('es', { maximumFractionDigits: 1 });
  const fmtInt = new Intl.NumberFormat('es');

  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function showError(msg) { $('errorBar').textContent = msg; $('errorBar').hidden = false; setTimeout(() => { $('errorBar').hidden = true; }, 6000); }
  function busy(on) { $('busyBar').hidden = !on; }
  function formatSize(b) { return b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }

  // --- Cambio de vista ---
  const VIEWS = { '3d': 'view3d', '2d': 'view2d', 'pdf': 'viewpdf' };
  const GROUPS = { '3d': 'grp3d', '2d': 'grp2d', 'pdf': 'grpPdf' };
  let mode = '3d';
  function setMode(m) {
    mode = m;
    for (const [k, id] of Object.entries(VIEWS)) $(id).hidden = (k !== m);
    for (const [k, id] of Object.entries(GROUPS)) $(id).classList.toggle('on', k === m);
  }
  function setStats(title, rows, note) {
    $('statsTitle').textContent = title;
    const body = $('statsBody');
    body.textContent = '';
    for (const [lbl, val] of rows) {
      const div = document.createElement('div');
      div.className = 'stat';
      const s = document.createElement('span'); s.className = 'lbl'; s.textContent = lbl;
      const b = document.createElement('b'); b.textContent = val;
      div.append(s, b);
      body.appendChild(div);
    }
    if (note) {
      const n = document.createElement('div');
      n.className = 'note';
      n.textContent = note;
      body.appendChild(n);
    }
  }

  /* ================= Módulo 3D (STL / OBJ) ================= */
  const host = $('view3d');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  host.appendChild(renderer.domElement);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x556066, 0.9));
  const dl1 = new THREE.DirectionalLight(0xffffff, 0.7); dl1.position.set(1, 2, 1.5); scene.add(dl1);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.25); dl2.position.set(-1.5, -1, -1); scene.add(dl2);

  let grid = null, modelGroup = null, meshes = [], wires = [], modelRadius = 50;
  const solidMaterial = new THREE.MeshStandardMaterial({
    color: new THREE.Color($('colorPick').value), metalness: 0.1, roughness: 0.65, side: THREE.DoubleSide
  });
  const normalsMaterial = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide });

  function applyTheme3d() { scene.background = new THREE.Color(cssVar('--canvas-bg')); rebuildGrid(); }
  function rebuildGrid() {
    if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
    const size = Math.max(10, Math.ceil((modelRadius * 2.5) / 10) * 10);
    grid = new THREE.GridHelper(size, 20, new THREE.Color(cssVar('--grid-major')), new THREE.Color(cssVar('--grid-minor')));
    grid.visible = $('gridChk').checked;
    if (modelGroup) grid.position.y = modelGroup.userData.floorY || 0;
    scene.add(grid);
  }
  function resize3d() {
    const w = host.clientWidth, h = host.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
  }
  new ResizeObserver(resize3d).observe(host);
  renderer.setAnimationLoop(() => {
    if (mode !== '3d') return;
    if (modelGroup && $('spinChk').checked) modelGroup.rotation.y += 0.006;
    controls.update();
    renderer.render(scene, camera);
  });

  function compute3dStats() {
    let tris = 0, verts = 0, volume = 0, area = 0;
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    const ab = new THREE.Vector3(), ac = new THREE.Vector3(), cr = new THREE.Vector3();
    for (const mesh of meshes) {
      const pos = mesh.geometry.attributes.position;
      if (!pos) continue;
      verts += pos.count;
      const idx = mesh.geometry.index;
      const n = idx ? idx.count / 3 : pos.count / 3;
      tris += n;
      for (let i = 0; i < n; i++) {
        if (idx) {
          a.fromBufferAttribute(pos, idx.getX(i * 3));
          b.fromBufferAttribute(pos, idx.getX(i * 3 + 1));
          c.fromBufferAttribute(pos, idx.getX(i * 3 + 2));
        } else {
          a.fromBufferAttribute(pos, i * 3);
          b.fromBufferAttribute(pos, i * 3 + 1);
          c.fromBufferAttribute(pos, i * 3 + 2);
        }
        volume += a.dot(cr.crossVectors(b, c)) / 6;
        area += ab.subVectors(b, a).cross(ac.subVectors(c, a)).length() / 2;
      }
    }
    return { tris, verts, volume: Math.abs(volume), area };
  }

  function currentMaterial() { return $('matSelect').value === 'normals' ? normalsMaterial : solidMaterial; }

  function setModel(object3d, label) {
    if (modelGroup) { scene.remove(modelGroup); modelGroup.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
    meshes = []; wires = [];
    modelGroup = new THREE.Group();
    let payload;
    if (object3d.isBufferGeometry) {
      object3d.computeVertexNormals();
      payload = new THREE.Mesh(object3d, currentMaterial());
    } else {
      payload = object3d;
      payload.traverse((o) => { if (o.isMesh) { o.material = currentMaterial(); if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals(); } });
    }
    modelGroup.add(payload);
    payload.traverse((o) => { if (o.isMesh) meshes.push(o); });

    const box = new THREE.Box3().setFromObject(payload);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    payload.position.sub(center);
    modelGroup.userData.floorY = -size.y / 2;
    modelRadius = Math.max(size.x, size.y, size.z) / 2 || 50;
    scene.add(modelGroup);

    for (const m of meshes) {
      const wf = new THREE.LineSegments(
        new THREE.WireframeGeometry(m.geometry),
        new THREE.LineBasicMaterial({ color: new THREE.Color(cssVar('--accent')), transparent: true, opacity: 0.45 })
      );
      wf.position.copy(m.position); wf.rotation.copy(m.rotation); wf.scale.copy(m.scale);
      wf.visible = $('wireChk').checked;
      m.parent.add(wf);
      wires.push(wf);
    }
    rebuildGrid();
    fitCamera(size);

    const s = compute3dStats();
    const cm3 = s.volume / 1000;
    setStats('Pieza', [
      ['Triángulos', fmtInt.format(s.tris)],
      ['Vértices', fmtInt.format(s.verts)],
      ['Tamaño (mm)', `${fmt.format(size.x)} × ${fmt.format(size.y)} × ${fmt.format(size.z)}`],
      ['Volumen', cm3 >= 0.05 ? fmt.format(cm3) + ' cm³' : '< 0,1 cm³'],
      ['Área', fmt.format(s.area / 100) + ' cm²'],
      ['Peso est. PLA', fmt.format(cm3 * 1.24) + ' g']
    ]);
    fileLabel.textContent = label;
    setMode('3d');
  }

  function fitCamera(size) {
    const maxDim = Math.max(size.x, size.y, size.z) || 100;
    const dist = maxDim / (2 * Math.tan((camera.fov * Math.PI) / 360)) * 1.6;
    camera.near = Math.max(dist / 1000, 0.01);
    camera.far = dist * 100;
    camera.position.set(dist * 0.7, dist * 0.55, dist * 0.8);
    camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.update();
  }

  $('matSelect').addEventListener('change', () => { for (const m of meshes) m.material = currentMaterial(); });
  $('colorPick').addEventListener('input', (e) => solidMaterial.color.set(e.target.value));
  $('wireChk').addEventListener('change', (e) => wires.forEach((w) => { w.visible = e.target.checked; }));
  $('gridChk').addEventListener('change', (e) => { if (grid) grid.visible = e.target.checked; });
  $('resetBtn').addEventListener('click', () => {
    if (!modelGroup) return;
    modelGroup.rotation.set(0, 0, 0);
    const box = new THREE.Box3().setFromObject(modelGroup);
    fitCamera(box.getSize(new THREE.Vector3()));
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme3d);
  new MutationObserver(applyTheme3d).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (reducedMotion) $('spinChk').checked = false;

  /* ================= Módulo 2D (SVG / GAG) con pan-zoom ================= */
  const view2d = $('view2d');
  const pz = $('pz');
  let zoom = 1, panX = 0, panY = 0, contentW = 0, contentH = 0;

  function applyPZ() {
    pz.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    $('zoomLbl2d').textContent = Math.round(zoom * 100) + '%';
  }
  function fit2d() {
    if (!contentW || !contentH) return;
    const w = view2d.clientWidth, h = view2d.clientHeight;
    zoom = Math.min(w / contentW, h / contentH) * 0.92;
    panX = (w - contentW * zoom) / 2;
    panY = (h - contentH * zoom) / 2;
    applyPZ();
  }
  function zoomAt(cx, cy, factor) {
    const nz = Math.min(20, Math.max(0.05, zoom * factor));
    panX = cx - (cx - panX) * (nz / zoom);
    panY = cy - (cy - panY) * (nz / zoom);
    zoom = nz;
    applyPZ();
  }
  view2d.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = view2d.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });
  $('zoomIn2d').addEventListener('click', () => zoomAt(view2d.clientWidth / 2, view2d.clientHeight / 2, 1.25));
  $('zoomOut2d').addEventListener('click', () => zoomAt(view2d.clientWidth / 2, view2d.clientHeight / 2, 1 / 1.25));
  $('fit2d').addEventListener('click', fit2d);

  const pointers = new Map();
  let pinchDist = 0;
  view2d.addEventListener('pointerdown', (e) => {
    view2d.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    view2d.classList.add('panning');
  });
  view2d.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      panX += e.clientX - prev.x;
      panY += e.clientY - prev.y;
      applyPZ();
    } else if (pointers.size === 2) {
      const pts = [...pointers.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchDist) {
        const r = view2d.getBoundingClientRect();
        zoomAt((pts[0].x + pts[1].x) / 2 - r.left, (pts[0].y + pts[1].y) / 2 - r.top, d / pinchDist);
      }
      pinchDist = d;
    }
  });
  const endPointer = (e) => { pointers.delete(e.pointerId); pinchDist = 0; if (!pointers.size) view2d.classList.remove('panning'); };
  view2d.addEventListener('pointerup', endPointer);
  view2d.addEventListener('pointercancel', endPointer);

  function show2d(node, w, h) {
    pz.textContent = '';
    pz.appendChild(node);
    contentW = w; contentH = h;
    setMode('2d');
    fit2d();
  }

  /* ---- SVG ---- */
  function loadSVG(text, file) {
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    const svg = doc.querySelector('svg');
    if (!svg || doc.querySelector('parsererror')) { showError('SVG no válido.'); return; }
    let w = parseFloat(svg.getAttribute('width')), h = parseFloat(svg.getAttribute('height'));
    const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    if ((!w || !h) && vb.length === 4) { w = vb[2]; h = vb[3]; }
    if (!w || !h) { w = 800; h = 600; }
    const img = document.createElement('img');
    img.width = w; img.height = h;
    img.src = URL.createObjectURL(new Blob([text], { type: 'image/svg+xml' }));
    img.onload = fit2d;
    show2d(img, w, h);
    setStats('SVG', [
      ['Dimensiones', `${fmt.format(w)} × ${fmt.format(h)} px`],
      ['Archivo', formatSize(file.size)]
    ]);
    fileLabel.textContent = file.name;
  }

  /* ---- GAG / SDJF: vista previa rápida ---- */
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function sanitizeIcon(svgText) {
    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
    const svg = doc.querySelector('svg');
    if (!svg) return null;
    doc.querySelectorAll('script, foreignObject').forEach((n) => n.remove());
    for (const n of doc.querySelectorAll('*')) {
      for (const at of [...n.attributes]) {
        if (/^on/i.test(at.name) || /javascript:/i.test(at.value)) n.removeAttribute(at.name);
      }
    }
    return svg;
  }
  function resolveColor(c, theme) {
    if (!c) return '#8a94a2';
    if (theme && theme[c]) return theme[c];
    return c;
  }

  function loadGAG(text, file) {
    let data;
    try { data = JSON.parse(text); } catch (e) { showError('El archivo no es JSON válido: ' + e.message); return; }
    const elements = data.elements || [];
    const connections = data.connections || [];
    if (!elements.length) { showError('El archivo no declara "elements".'); return; }
    const theme = data.theme || {};
    const unions = data.unions || [];

    // uniones como nodos sintéticos (barra) + aristas a progenitores
    const allNodes = elements.map((e) => ({ ...e }));
    const extraConns = [];
    for (const u of unions) {
      allNodes.push({ id: u.id, type: '_union', label: '' });
      for (const p of (u.between || [])) extraConns.push({ from: p, to: u.id, direction: 'none' });
    }
    const conns = connections.concat(extraConns);
    const byId = new Map(allNodes.map((n) => [n.id, n]));

    // Layout: respeta x/y manuales; el resto por rangos (camino más largo) + orden barycenter
    const NODE_W = 120, NODE_H = 78, GAP_X = 40, GAP_Y = 70;
    const manual = allNodes.filter((n) => typeof n.x === 'number' && typeof n.y === 'number');
    if (manual.length === allNodes.length) {
      for (const n of allNodes) { n.px = n.x; n.py = n.y; }
    } else {
      const rank = new Map();
      const out = new Map(), indeg = new Map();
      for (const n of allNodes) { out.set(n.id, []); indeg.set(n.id, 0); }
      for (const c of conns) {
        if (byId.has(c.from) && byId.has(c.to) && c.from !== c.to) {
          out.get(c.from).push(c.to);
          indeg.set(c.to, indeg.get(c.to) + 1);
        }
      }
      // longest-path por orden topológico (con corte de ciclos por visita)
      const order = [];
      const q = allNodes.filter((n) => indeg.get(n.id) === 0).map((n) => n.id);
      const indegW = new Map(indeg);
      while (q.length) {
        const id = q.shift();
        order.push(id);
        for (const t of out.get(id)) {
          indegW.set(t, indegW.get(t) - 1);
          if (indegW.get(t) === 0) q.push(t);
        }
      }
      for (const n of allNodes) if (!order.includes(n.id)) order.push(n.id); // ciclos
      for (const id of order) if (!rank.has(id)) rank.set(id, 0);
      for (const id of order) {
        for (const t of out.get(id) || []) {
          if (rank.get(t) == null || rank.get(t) < rank.get(id) + 1) {
            if (order.indexOf(t) > order.indexOf(id)) rank.set(t, (rank.get(id) || 0) + 1);
          }
        }
      }
      const rows = new Map();
      for (const n of allNodes) {
        const r = rank.get(n.id) || 0;
        if (!rows.has(r)) rows.set(r, []);
        rows.get(r).push(n);
      }
      const sortedRanks = [...rows.keys()].sort((a, b) => a - b);
      // una pasada de barycenter para reducir cruces
      const posInRow = new Map();
      sortedRanks.forEach((r) => rows.get(r).forEach((n, i) => posInRow.set(n.id, i)));
      for (let pass = 0; pass < 2; pass++) {
        for (const r of sortedRanks) {
          const row = rows.get(r);
          row.sort((a, b) => bary(a) - bary(b));
          row.forEach((n, i) => posInRow.set(n.id, i));
        }
      }
      function bary(n) {
        const nb = [];
        for (const c of conns) {
          if (c.from === n.id && byId.has(c.to)) nb.push(c.to);
          if (c.to === n.id && byId.has(c.from)) nb.push(c.from);
        }
        const vals = nb.map((id) => posInRow.get(id)).filter((v) => v != null);
        return vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : posInRow.get(n.id) || 0;
      }
      const maxRow = Math.max(...sortedRanks.map((r) => rows.get(r).length));
      for (const r of sortedRanks) {
        const row = rows.get(r);
        const rowW = row.length * (NODE_W + GAP_X) - GAP_X;
        const startX = (maxRow * (NODE_W + GAP_X) - GAP_X - rowW) / 2;
        row.forEach((n, i) => {
          n.px = startX + i * (NODE_W + GAP_X) + NODE_W / 2;
          n.py = r * (NODE_H + GAP_Y) + NODE_H / 2;
        });
      }
      if (data.canvas && data.canvas.flow === 'up') {
        const maxY = Math.max(...allNodes.map((n) => n.py));
        for (const n of allNodes) n.py = maxY - n.py + NODE_H / 2;
      }
    }

    // Dibujo
    const PAD = 50;
    const minX = Math.min(...allNodes.map((n) => n.px)) - NODE_W / 2 - PAD;
    const minY = Math.min(...allNodes.map((n) => n.py)) - NODE_H / 2 - PAD;
    const maxX = Math.max(...allNodes.map((n) => n.px)) + NODE_W / 2 + PAD;
    const maxY = Math.max(...allNodes.map((n) => n.py)) + NODE_H / 2 + PAD;
    const W = maxX - minX, H = maxY - minY;
    const svg = el('svg', { xmlns: NS, viewBox: `${minX} ${minY} ${W} ${H}`, width: W, height: H });
    svg.appendChild(el('rect', { x: minX, y: minY, width: W, height: H, fill: '#ffffff' }));

    const defs = el('defs', {});
    defs.appendChild(el('marker', { id: 'arr', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }))
        .appendChild(el('path', { d: 'M0,0 L10,5 L0,10 z', fill: '#4a5563' }));
    svg.appendChild(defs);

    for (const c of conns) {
      const f = byId.get(c.from), t = byId.get(c.to);
      if (!f || !t) continue;
      const stroke = resolveColor(c.color, theme) !== '#8a94a2' && c.color ? resolveColor(c.color, theme) : '#4a5563';
      const line = el('line', { x1: f.px, y1: f.py, x2: t.px, y2: t.py, stroke, 'stroke-width': 1.6 });
      if (c.style === 'dashed' || c.line_style === 'dashed') line.setAttribute('stroke-dasharray', '8 5');
      if (c.style === 'dotted' || c.line_style === 'dotted') line.setAttribute('stroke-dasharray', '2 4');
      const dir = c.direction || 'none';
      if (dir === 'forward' || dir === 'bidirectional') line.setAttribute('marker-end', 'url(#arr)');
      if (dir === 'backward' || dir === 'bidirectional') line.setAttribute('marker-start', 'url(#arr)');
      svg.appendChild(line);
      if (c.label) {
        const mx = (f.px + t.px) / 2, my = (f.py + t.py) / 2;
        const tx = el('text', { x: mx, y: my - 4, 'font-size': 11, 'text-anchor': 'middle', fill: '#5d6673', 'font-family': 'sans-serif' }, c.label);
        svg.appendChild(tx);
      }
    }

    const icons = data.icons || {};
    for (const n of allNodes) {
      const g = el('g', { transform: `translate(${n.px}, ${n.py})` });
      if (n.type === '_union') {
        g.appendChild(el('rect', { x: -16, y: -3, width: 32, height: 6, rx: 3, fill: '#6b6558' }));
      } else {
        const color = resolveColor(n.color, theme);
        let iconDrawn = false;
        if (icons[n.type]) {
          const ic = sanitizeIcon(icons[n.type]);
          if (ic) {
            ic.setAttribute('x', -32); ic.setAttribute('y', -30);
            ic.setAttribute('width', 64); ic.setAttribute('height', 40);
            ic.style.color = color;
            g.appendChild(ic);
            iconDrawn = true;
          }
        }
        if (!iconDrawn) {
          g.appendChild(el('rect', { x: -34, y: -30, width: 68, height: 42, rx: 8, fill: color, 'fill-opacity': 0.85, stroke: '#3c4450', 'stroke-width': 1 }));
          const initial = (n.type || '?').slice(0, 4);
          g.appendChild(el('text', { x: 0, y: -5, 'font-size': 10, 'text-anchor': 'middle', fill: '#ffffff', 'font-family': 'sans-serif' }, initial));
        }
        const lines = String(n.label || n.id).split('\n');
        lines.forEach((ln, i) => {
          const t = el('text', { x: 0, y: 24 + i * 13, 'font-size': 11.5, 'text-anchor': 'middle', fill: '#1b222c', 'font-family': 'sans-serif' }, ln);
          t.setAttribute('paint-order', 'stroke');
          t.setAttribute('stroke', '#ffffff');
          t.setAttribute('stroke-width', 3);
          svgLater.push([g, t]);
        });
      }
      svg.appendChild(g);
    }
    // labels al final para que queden encima de las líneas
    for (const [g, t] of svgLater.splice(0)) g.appendChild(t);

    show2d(svg, W, H);

    const types = [...new Set(elements.map((e) => e.type || 'unknown'))];
    const rows = [
      ['Elementos', fmtInt.format(elements.length)],
      ['Conexiones', fmtInt.format(connections.length)],
      ['Tipos', types.slice(0, 5).join(', ') + (types.length > 5 ? '…' : '')]
    ];
    if (data.areas) rows.push(['Áreas', data.areas.map((a) => a.label || a.id).join(', ')]);
    if (data.journeys) rows.push(['Recorridos', fmtInt.format(data.journeys.length)]);
    if (unions.length) rows.push(['Uniones', fmtInt.format(unions.length)]);
    setStats('Diagrama', rows,
      'Vista previa rápida: el layout oficial lo decide el motor AlmaGag. Para el render definitivo, genera el SVG con almagag y ábrelo aquí.');
    fileLabel.textContent = file.name;
  }
  const svgLater = [];

  /* ================= Módulo PDF ================= */
  const pdfPagesDiv = $('pdfPages');
  let pdfDoc = null, pdfScale = 1.2, pdfObserver = null;

  async function loadPDF(buf, file) {
    busy(true);
    try {
      pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
      const page1 = await pdfDoc.getPage(1);
      const vp = page1.getViewport({ scale: 1 });
      setStats('Documento', [
        ['Páginas', fmtInt.format(pdfDoc.numPages)],
        ['Tamaño página', `${fmt.format(vp.width * 0.3528)} × ${fmt.format(vp.height * 0.3528)} mm`],
        ['Archivo', formatSize(file.size)]
      ]);
      fileLabel.textContent = file.name;
      setMode('pdf');
      renderPdfPages();
    } catch (e) {
      showError('PDF no válido: ' + (e.message || e));
    } finally { busy(false); }
  }

  function renderPdfPages() {
    if (pdfObserver) pdfObserver.disconnect();
    pdfPagesDiv.textContent = '';
    $('zoomLblPdf').textContent = Math.round(pdfScale * 83) + '%';
    const canvases = [];
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const c = document.createElement('canvas');
      c.dataset.page = i;
      c.width = 100; c.height = 140;
      pdfPagesDiv.appendChild(c);
      canvases.push(c);
    }
    pdfObserver = new IntersectionObserver(async (entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const c = entry.target;
        if (c.dataset.done) continue;
        c.dataset.done = '1';
        pdfObserver.unobserve(c);
        try {
          const page = await pdfDoc.getPage(parseInt(c.dataset.page, 10));
          const vp = page.getViewport({ scale: pdfScale * (devicePixelRatio > 1 ? 1.5 : 1) });
          c.width = vp.width; c.height = vp.height;
          c.style.width = (vp.width / (devicePixelRatio > 1 ? 1.5 : 1)) + 'px';
          await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        } catch (e) { /* página corrupta: se deja el lienzo vacío */ }
      }
    }, { root: $('viewpdf'), rootMargin: '600px' });
    canvases.forEach((c) => pdfObserver.observe(c));
  }
  $('zoomInPdf').addEventListener('click', () => { pdfScale = Math.min(4, pdfScale * 1.25); renderPdfPages(); });
  $('zoomOutPdf').addEventListener('click', () => { pdfScale = Math.max(0.4, pdfScale / 1.25); renderPdfPages(); });

  /* ================= Router de archivos ================= */
  function loadFile(file) {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const reader = new FileReader();
    reader.onerror = () => showError('No se pudo leer el archivo.');
    if (ext === 'stl') {
      reader.onload = () => {
        try { setModel(new THREE.STLLoader().parse(reader.result), file.name); }
        catch (e) { showError('STL no válido: ' + e.message); }
      };
      reader.readAsArrayBuffer(file);
    } else if (ext === 'obj') {
      reader.onload = () => {
        try {
          const group = new THREE.OBJLoader().parse(reader.result);
          let has = false;
          group.traverse((o) => { if (o.isMesh) has = true; });
          if (!has) throw new Error('sin geometría');
          setModel(group, file.name);
        } catch (e) { showError('OBJ no válido: ' + e.message); }
      };
      reader.readAsText(file);
    } else if (ext === 'svg') {
      reader.onload = () => loadSVG(reader.result, file);
      reader.readAsText(file);
    } else if (ext === 'gag' || ext === 'sdjf') {
      reader.onload = () => { try { loadGAG(reader.result, file); } catch (e) { showError('Error al leer el diagrama: ' + e.message); } };
      reader.readAsText(file);
    } else if (ext === 'pdf') {
      reader.onload = () => loadPDF(reader.result, file);
      reader.readAsArrayBuffer(file);
    } else {
      showError('Formato no soportado. Abre .gag, .sdjf, .svg, .stl, .obj o .pdf.');
    }
  }

  $('openBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });
  ['dragover', 'dragenter'].forEach((ev) => stage.addEventListener(ev, (e) => e.preventDefault()));
  stage.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

  /* ================= Arranque ================= */
  applyTheme3d();
  resize3d();
  const sample = new THREE.TorusKnotGeometry(20, 6, 220, 36);
  sample.rotateX(-Math.PI / 2);
  setModel(sample.toNonIndexed(), 'pieza de ejemplo — nudo toroidal (60 mm)');
})();
</script>
