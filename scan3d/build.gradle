plugins {
    id 'com.android.application'
}

android {
    namespace 'com.poc.scan3d'
    compileSdk 34

    defaultConfig {
        applicationId 'com.poc.scan3d'
        // Android 11+: cámaras físicas múltiples y verificación de sesión.
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            maxHeapSize = '2g'
            testLogging {
                events 'passed', 'failed'
                showStandardStreams = true
                exceptionFormat = 'full'
            }
        }
    }
}

dependencies {
    // Compartir el PDF del escenario y los modelos vía FileProvider.
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
